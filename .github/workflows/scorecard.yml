# OpenSSF Scorecard: supply-chain checks on main, weekly and on demand. Results go to
# code scanning (Security tab) and to the public Scorecard API (publish_results), which
# backs the README badge. Publishing requires this exact shape: no workflow- or
# job-level env or defaults, no run steps, an Ubuntu runner and only the approved
# actions in the job (checkout, scorecard-action, upload-artifact, upload-sarif).
name: Scorecard

on:
  push:
    branches: [main]
  # Branch protection or ruleset changes affect the Branch-Protection check.
  branch_protection_rule:
  schedule:
    # Weekly on Mondays.
    - cron: "29 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read # read the workflow runs Scorecard evaluates
      security-events: write # upload SARIF to code scanning
      id-token: write # sign the published results (publish_results)
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Keep the SARIF as an artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
          category: scorecard
