# store-release's own CI. Pull requests, main, a weekly run (for the canary) and
# manual runs. A newer push to a pull request cancels its older run; main,
# scheduled and manual runs are never cancelled.
#
#   test (stdlib)    the unit suite without the lock (only "needs Pillow" skips allowed)
#   test (strict)    both locks; unit, fixture apps, fud-ai parity and workflow tests; no skip
#   test (macos)     the release-path profiles on macOS (the build job's stdlib-only code)
#   lint             Python lint (ruff, pyflakes rules)
#   package          the PyPI sdist and wheel: built, twine check --strict, exact contents; the
#                    wheel alone runs store-release (--help, --version, init) on every supported Python
#   workflows        actionlint on these workflows and on every example's and template's callers
#   canary (fud-ai)  advisory: the store checks against apoorvdarshan/fud-ai@main
name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  test-stdlib:
    name: test (stdlib)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Unit suite, standard library only
        run: python3 -I -u run.py selftest --platform all

  test-strict:
    name: test (strict)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install both locks
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --require-hashes \
            -r requirements.txt -r requirements-checks.txt
          python3 -m pip check
      - name: Every suite, no skip allowed
        env:
          STORE_RELEASE_TESTS_STRICT: "1"
        run: >-
          python3 -I -u run.py selftest --platform all --suite unit --suite apps --suite parity --suite workflows
          --require-pillow --strict

  test-macos:
    name: test (macos)
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: The release-path profiles (stdlib only)
        run: |
          set -euo pipefail
          python3 -I -u run.py selftest --platform ios
          python3 -I -u run.py selftest --platform android

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install the lint lock
        run: python3 -m pip install --disable-pip-version-check --require-hashes -r requirements-lint.txt
      - name: Lint (ruff, pyflakes rules)
        run: python3 -m ruff check --output-format github .

  package:
    name: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Every Python pyproject.toml claims (its classifiers); the last one listed is python3.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: |
            3.11
            3.12
            3.14
            3.15
            3.13
      - name: Install the dist lock
        run: python3 -m pip install --disable-pip-version-check --require-hashes -r requirements-dist.txt
      - name: Build the sdist and the wheel
        run: python3 -I scripts/dists.py build --out "$RUNNER_TEMP/dist"
      - name: Check them, and run the wheel alone on every supported Python
        run: >-
          python3 -I scripts/dists.py check "$RUNNER_TEMP/dist"
          --python python3.11 --python python3.12 --python python3.13 --python python3.14 --python python3.15

  workflows:
    name: workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install actionlint 1.7.12 (checksum-pinned)
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -version
          shellcheck --version | head -2
      # actionlint 1.7.12 does not know job.workflow_sha / job.workflow_repository yet
      # (documented contexts); drop this ignore once it does. Any other finding fails.
      - name: Lint this repository's workflows
        run: >-
          "$RUNNER_TEMP/actionlint" -color
          -ignore 'property "workflow_(sha|repository)" is not defined in object type'
      # The callers live in app repositories: copy each example's and template's into a scratch
      # repository with stub local workflows, so their local references resolve. actionlint
      # 1.7.12 does not know concurrency.queue yet (documented); drop the ignore once it does.
      - name: Lint every app's and template's rendered callers
        run: |
          set -euo pipefail
          python3 -I -u scripts/render_examples.py --check
          for dir in examples/*/ examples/templates/*/; do
            dir="${dir%/}"
            [ -d "$dir/callers" ] || continue
            app="$(basename "$dir")"
            repo="$RUNNER_TEMP/callers-$app"
            mkdir -p "$repo/.github/workflows"
            git -C "$repo" init -q
            cp "$dir/callers/"*.yml "$repo/.github/workflows/"
            # Workflows an app adds with its migration (examples/<app>/app-files).
            if [ -d "$dir/app-files/.github/workflows" ]; then
              cp "$dir/app-files/.github/workflows/"*.yml "$repo/.github/workflows/"
            fi
            # The apps' own gate workflows, as stubs that take the inputs the callers pass.
            for stub in ios-tests android-tests quality ci; do
              printf 'name: %s\non:\n  workflow_call:\n    inputs:\n      android-release:\n        type: boolean\n        default: false\npermissions:\n  contents: read\njobs:\n  stub:\n    runs-on: ubuntu-latest\n    steps:\n      - run: echo stub\n' \
                "$stub" > "$repo/.github/workflows/$stub.yml"
            done
            (cd "$repo" && "$RUNNER_TEMP/actionlint" -color -ignore 'unexpected key "queue" for "concurrency" section')
            echo "$app: callers lint clean"
          done

      # job-setup's lazy blob fetch on GitHub, with a job token: a blobless, credential-free checkout
      # of this repository (as the reusable workflows check out an app), then fetch-app-files.sh.
      - name: Check out this repository blobless, as the reusable workflows check out an app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: fetch-probe
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: /README.md
      - name: Fetch more of it with job-setup's fetch script and the job token
        env:
          FETCH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '/README.md\n/docs/\n' > "$RUNNER_TEMP/fetch-probe-paths.txt"
          bash .github/actions/job-setup/fetch-app-files.sh fetch-probe "$RUNNER_TEMP/fetch-probe-paths.txt"
          test -f fetch-probe/docs/config.md
          test ! -e fetch-probe/store_release
          if grep -qi extraheader fetch-probe/.git/config; then echo "error: a credential reached .git/config" >&2; exit 1; fi
          echo "fetched $(find fetch-probe/docs -type f | wc -l) docs files; no credential persisted"

  # Advisory, never required: fud-ai's real files through the store checks (without the
  # pin, caller, yanked and artifact steps). Never uploads anything: app listings and
  # screenshots stay in their own repositories.
  canary:
    name: canary (fud-ai)
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out store-release at this commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .store-release
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Check out apoorvdarshan/fud-ai@main (store files only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: apoorvdarshan/fud-ai
          ref: main
          path: app
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: /store/
      # Until fud-ai ships its own store/store-release.toml, the example config stands in
      # (untracked, so the sparse checkout below leaves it alone). Its catalog hook is
      # dropped while scripts/ci/check_catalog.py does not exist in fud-ai yet.
      - name: Overlay the config until fud-ai has its own
        run: |
          set -euo pipefail
          if [ -f app/store/store-release.toml ]; then
            echo "fud-ai has its own store/store-release.toml"
            exit 0
          fi
          cp .store-release/examples/fud-ai/store-release.toml app/store/store-release.toml
          if ! git -C app cat-file -e HEAD:scripts/ci/check_catalog.py 2>/dev/null; then
            python3 -I - <<'PY'
          from pathlib import Path
          path = Path("app/store/store-release.toml")
          text = path.read_text()
          old = 'checks = ["scripts/ci/check_catalog.py"]'
          assert text.count(old) == 1
          path.write_text(text.replace(old, "checks = []"))
          PY
            echo "catalog hook dropped: scripts/ci/check_catalog.py is not in fud-ai yet"
          fi
      - name: Sparse-check out what the store checks read
        run: |
          set -euo pipefail
          python3 -I -u .store-release/run.py --app-root app paths --job checks > "$RUNNER_TEMP/paths.txt"
          cat "$RUNNER_TEMP/paths.txt"
          git -C app sparse-checkout set --no-cone --stdin < "$RUNNER_TEMP/paths.txt"
          test -f app/store/store-release.toml
      - name: Install both locks
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --require-hashes \
            -r .store-release/requirements.txt -r .store-release/requirements-checks.txt
      - name: Run the canary
        run: python3 -I -u .store-release/run.py --app-root app canary --expect .store-release/tests/canary/fud-ai.toml
