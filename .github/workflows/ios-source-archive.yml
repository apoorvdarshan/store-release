# iOS release, ios.github_release.source_archive (job "source-archive"): a git archive of the
# tagged commit, its SHA-256 and a Sigstore keyless bundle, with a build-provenance
# attestation; the GitHub Release job attaches them. Only an app whose config turns
# source_archive on calls it (it alone needs id-token: write). See docs/workflows.md.
name: "store-release: iOS source archive"

on:
  workflow_call:
    inputs:
      config:
        description: The app's store-release.toml, relative to its repository root.
        type: string
        default: store/store-release.toml
      gates:
        description: The gate jobs' results, "<job>=<result>" separated by spaces.
        type: string
        required: true
      marketing_version:
        type: string
        required: true
      uploaded_build:
        description: The build number this run uploaded (empty without an upload).
        type: string
        required: true
      tool_sha:
        type: string
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  source-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # Sigstore keyless signing + build provenance (OIDC token)
      attestations: write # store the build-provenance attestation
    steps:
      - name: Check out the app's store-release config
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: app
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: /${{ inputs.config }}
      - name: Check out store-release at this workflow's commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .store-release
          persist-credentials: false
      - name: Set up this job
        uses: ./.store-release/.github/actions/job-setup
        with:
          job: ios-source-archive
          config: ${{ inputs.config }}
          tool-sha: ${{ job.workflow_sha }}
          expected-tool-sha: ${{ inputs.tool_sha }}
      - name: Check this stage's inputs
        env:
          INPUT_GATES: ${{ inputs.gates }}
          INPUT_VERSION: ${{ inputs.marketing_version }}
          INPUT_UPLOADED_BUILD: ${{ inputs.uploaded_build }}
        run: >-
          python3 -I -u .store-release/run.py --app-root app stage check --stage ios-source-archive --gates "$INPUT_GATES"
          --marketing-version "$INPUT_VERSION" --uploaded-build "$INPUT_UPLOADED_BUILD"
      # The whole tagged tree: the archive is made from the tagged commit.
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          persist-credentials: false
      - name: Archive the tagged source
        env:
          VERSION: ${{ inputs.marketing_version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dist"
          cd "$RUNNER_TEMP/dist"
          archive="${STORE_RELEASE_SLUG}-${VERSION}-source.tar.gz"
          git -C "$GITHUB_WORKSPACE/source" archive --format=tar.gz --prefix="${STORE_RELEASE_SLUG}-${VERSION}/" \
            -o "$RUNNER_TEMP/dist/$archive" "$GITHUB_SHA"
          sha256sum "$archive" > "$archive.sha256"
          cat "$archive.sha256"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the source archive (Sigstore keyless)
        env:
          VERSION: ${{ inputs.marketing_version }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/dist/${STORE_RELEASE_SLUG}-${VERSION}-source.tar.gz"
          cosign sign-blob --yes --bundle "$archive.sigstore.json" "$archive"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/dist/*-source.tar.gz
      - name: Hand the signed archive to the GitHub Release job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-source-archive-${{ github.run_id }}
          path: ${{ runner.temp }}/dist
          retention-days: 1
          overwrite: true
          if-no-files-found: error
