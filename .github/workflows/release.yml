# Release store-release: dispatch-only, from main. scripts/release_check.py verifies
# everything (version, CHANGELOG section, yanked list, this commit's required CI)
# before the tag exists; the tag and the GitHub Release are then created together,
# in one call; then the release's own sdist and wheel go to PyPI. Process:
# docs/release-process.md.
#
#   dists    builds the sdist and the wheel from this commit and checks them (read-only)
#   release  checks the preconditions, archives the source, signs and attests the archive
#            and the dists, and creates the tag and the GitHub Release with all of them
#   pypi     publishes the GitHub Release's sdist and wheel to PyPI: Trusted Publishing
#            (OIDC, no token or secret) with PEP 740 attestations, in the `pypi` environment.
#            It runs after the release exists, so a failure leaves the release as it is, and
#            re-running it is safe: a file PyPI already has with the same SHA-256 is skipped,
#            one with another digest fails.
#
# Release assets: the commit's source archive (git archive), the sdist and the wheel, each
# with its SHA-256 and a Sigstore keyless signature bundle (cosign), and SLSA build
# provenance attestations (also stored by GitHub). Verify with
#   gh attestation verify store-release-X.Y.Z-source.tar.gz --repo apoorvdarshan/store-release
#   cosign verify-blob --bundle store-release-X.Y.Z-source.tar.gz.sigstore.json \
#     --certificate-identity-regexp '^https://github.com/apoorvdarshan/store-release/\.github/workflows/release\.yml@refs/heads/main$' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com store-release-X.Y.Z-source.tar.gz
# (the same for store_release-X.Y.Z.tar.gz and store_release-X.Y.Z-py3-none-any.whl).
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (X.Y.Z). Must equal store_release.__version__ on main.
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  # The build runs here, without write access or an OIDC token; the release job only adds
  # these exact files to the release.
  dists:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install the dist lock
        run: python3 -m pip install --disable-pip-version-check --require-hashes -r requirements-dist.txt
      - name: Build the sdist and the wheel
        env:
          VERSION: ${{ inputs.version }}
        run: python3 -I scripts/dists.py build --out "$RUNNER_TEMP/python-dists" --version "$VERSION"
      - name: Check them (twine, contents, the wheel alone in a new environment)
        run: python3 -I scripts/dists.py check "$RUNNER_TEMP/python-dists"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-dists
          path: ${{ runner.temp }}/python-dists/
          if-no-files-found: error
          retention-days: 7

  release:
    needs: dists
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # create the tag and the GitHub Release
      checks: read      # read this commit's CI results
      actions: read     # which workflow runs those results belong to
      id-token: write   # Sigstore keyless signing and the provenance attestations
      attestations: write # store the provenance attestations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Check the release preconditions
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: python3 -I scripts/release_check.py --version "$VERSION" --sha "$GITHUB_SHA" --notes-out "$RUNNER_TEMP/notes.md"
      # Built only after every precondition holds: an archive of exactly this commit.
      - name: Archive this commit's source
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dist"
          cd "$RUNNER_TEMP/dist"
          archive="store-release-${VERSION}-source.tar.gz"
          git -C "$GITHUB_WORKSPACE" archive --format=tar.gz --prefix="store-release-${VERSION}/" \
            -o "$RUNNER_TEMP/dist/$archive" "$GITHUB_SHA"
          sha256sum "$archive" > "$archive.sha256"
          cat "$archive.sha256"
      # The sdist and the wheel the dists job built from this commit.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dists
          path: ${{ runner.temp }}/dist
      - name: Checksum the sdist and the wheel
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/dist"
          for file in "store_release-${VERSION}.tar.gz" "store_release-${VERSION}-py3-none-any.whl"; do
            sha256sum "$file" > "$file.sha256"
            cat "$file.sha256"
          done
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the source archive, the sdist and the wheel (Sigstore keyless)
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          for file in "store-release-${VERSION}-source.tar.gz" "store_release-${VERSION}.tar.gz" \
            "store_release-${VERSION}-py3-none-any.whl"; do
            cosign sign-blob --yes --bundle "$RUNNER_TEMP/dist/$file.sigstore.json" "$RUNNER_TEMP/dist/$file"
          done
      - name: Attest build provenance
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/dist/store-release-*-source.tar.gz
      - name: Attest the sdist's and the wheel's build provenance
        id: dists-provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/dist/store_release-*.tar.gz
            ${{ runner.temp }}/dist/store_release-*-py3-none-any.whl
      # The attestation bundles (JSON Lines) also ship with the release, for offline checks.
      - name: Add the provenance to the release assets
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          DISTS_BUNDLE: ${{ steps.dists-provenance.outputs.bundle-path }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          cp "$BUNDLE" "$RUNNER_TEMP/dist/store-release-${VERSION}-source.tar.gz.intoto.jsonl"
          cp "$DISTS_BUNDLE" "$RUNNER_TEMP/dist/store_release-${VERSION}.intoto.jsonl"
          ls -l "$RUNNER_TEMP/dist"
      # One call creates the tag on this commit and publishes the release, so a failure
      # cannot leave a tag without its release (immutable releases lock the tag as it is
      # created). With assets, gh uploads them to a draft and publishes it last (an
      # immutable release takes no assets once published); a failed upload deletes the
      # draft. The check above found no vX.Y.Z tag. The call can also fail after GitHub
      # published the release, so whatever it reports, release-check decides: the release
      # counts only when it is published and immutable, its tag is this commit, and its
      # assets are exactly these files (then the pypi job runs).
      - name: Create the tag and the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          dist="$RUNNER_TEMP/dist"
          if ! gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md" --latest \
            "$dist/store-release-${VERSION}-source.tar.gz" \
            "$dist/store-release-${VERSION}-source.tar.gz.sha256" \
            "$dist/store-release-${VERSION}-source.tar.gz.sigstore.json" \
            "$dist/store-release-${VERSION}-source.tar.gz.intoto.jsonl" \
            "$dist/store_release-${VERSION}.tar.gz" \
            "$dist/store_release-${VERSION}.tar.gz.sha256" \
            "$dist/store_release-${VERSION}.tar.gz.sigstore.json" \
            "$dist/store_release-${VERSION}-py3-none-any.whl" \
            "$dist/store_release-${VERSION}-py3-none-any.whl.sha256" \
            "$dist/store_release-${VERSION}-py3-none-any.whl.sigstore.json" \
            "$dist/store_release-${VERSION}.intoto.jsonl"; then
            echo "::warning::gh release create failed; checking whether GitHub published v$VERSION anyway"
          fi
          python3 -I scripts/dists.py release-check "$dist" --version "$VERSION" --sha "$GITHUB_SHA" \
            --repository "$GITHUB_REPOSITORY" --complete

  # PyPI gets the very files the GitHub Release carries. PyPI's trusted publisher for
  # store-release names this repository, release.yml and the `pypi` environment.
  pypi:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: pypi
      url: https://pypi.org/project/store-release/${{ inputs.version }}/
    permissions:
      contents: read    # download the release's files
      id-token: write   # Trusted Publishing and the PEP 740 attestations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      # The files to publish: the release's (published, immutable, tagged on this commit),
      # matching their .sha256 assets, with build provenance from this workflow on this commit.
      - name: Download the release's sdist and wheel, and check them
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          release="$RUNNER_TEMP/release"
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --dir "$release" \
            --pattern "store_release-${VERSION}*"
          python3 -I scripts/dists.py release-check "$release" --version "$VERSION" --sha "$GITHUB_SHA" \
            --repository "$GITHUB_REPOSITORY"
          cd "$release"
          for file in "store_release-${VERSION}.tar.gz" "store_release-${VERSION}-py3-none-any.whl"; do
            sha256sum -c "$file.sha256"
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" --bundle "store_release-${VERSION}.intoto.jsonl" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref refs/heads/main --source-digest "$GITHUB_SHA" --deny-self-hosted-runners
            echo "$file: provenance from release.yml on $GITHUB_SHA"
          done
          mkdir "$RUNNER_TEMP/dists"
          mv "store_release-${VERSION}.tar.gz" "store_release-${VERSION}-py3-none-any.whl" "$RUNNER_TEMP/dists/"
      # Inside the workspace: the publish action runs in a container that sees only the workspace.
      - name: Compare them with what PyPI has
        id: plan
        env:
          VERSION: ${{ inputs.version }}
        run: python3 -I scripts/dists.py pypi-plan "$RUNNER_TEMP/dists" --version "$VERSION" --upload-dir pypi-upload
      - name: Publish to PyPI
        if: steps.plan.outputs.upload == 'true'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: pypi-upload/
          attestations: true
          print-hash: true
      - name: Check that PyPI serves the release's files, attested by this workflow
        env:
          VERSION: ${{ inputs.version }}
        run: >-
          python3 -I scripts/dists.py pypi-verify "$RUNNER_TEMP/dists" --version "$VERSION"
          --repository "$GITHUB_REPOSITORY" --workflow release.yml --environment pypi
