# Release store-release: dispatch-only, from main. scripts/release_check.py verifies
# everything (version, CHANGELOG section, yanked list, this commit's required CI)
# before the tag exists; the tag and the GitHub Release are then created together,
# in one call. Process: docs/release-process.md.
#
# Release assets: the commit's source archive (git archive), its SHA-256, a Sigstore
# keyless signature bundle (cosign) and a SLSA build provenance attestation (also
# stored by GitHub). Verify with
#   gh attestation verify store-release-X.Y.Z-source.tar.gz --repo apoorvdarshan/store-release
#   cosign verify-blob --bundle store-release-X.Y.Z-source.tar.gz.sigstore.json \
#     --certificate-identity-regexp '^https://github.com/apoorvdarshan/store-release/\.github/workflows/release\.yml@refs/heads/main$' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com store-release-X.Y.Z-source.tar.gz
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (X.Y.Z). Must equal store_release.__version__ on main.
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # create the tag and the GitHub Release
      checks: read      # read this commit's CI results
      actions: read     # which workflow runs those results belong to
      id-token: write   # Sigstore keyless signing and the provenance attestation
      attestations: write # store the provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Check the release preconditions
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: python3 -I scripts/release_check.py --version "$VERSION" --sha "$GITHUB_SHA" --notes-out "$RUNNER_TEMP/notes.md"
      # Built only after every precondition holds: an archive of exactly this commit.
      - name: Archive this commit's source
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dist"
          cd "$RUNNER_TEMP/dist"
          archive="store-release-${VERSION}-source.tar.gz"
          git -C "$GITHUB_WORKSPACE" archive --format=tar.gz --prefix="store-release-${VERSION}/" \
            -o "$RUNNER_TEMP/dist/$archive" "$GITHUB_SHA"
          sha256sum "$archive" > "$archive.sha256"
          cat "$archive.sha256"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the source archive (Sigstore keyless)
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/dist/store-release-${VERSION}-source.tar.gz"
          cosign sign-blob --yes --bundle "$archive.sigstore.json" "$archive"
      - name: Attest build provenance
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/dist/store-release-*-source.tar.gz
      # The attestation bundle (JSON Lines) also ships with the release, for offline checks.
      - name: Add the provenance to the release assets
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          cp "$BUNDLE" "$RUNNER_TEMP/dist/store-release-${VERSION}-source.tar.gz.intoto.jsonl"
          ls -l "$RUNNER_TEMP/dist"
      # One call creates the tag on this commit and publishes the release, so a failure
      # cannot leave a tag without its release (immutable releases lock the tag as it is
      # created). With assets, gh uploads them to a draft and publishes it last (an
      # immutable release takes no assets once published); a failed upload deletes the
      # draft. The check above found no vX.Y.Z tag; the last lines confirm where it points.
      - name: Create the tag and the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md" --latest \
            "$RUNNER_TEMP/dist/store-release-${VERSION}-source.tar.gz" \
            "$RUNNER_TEMP/dist/store-release-${VERSION}-source.tar.gz.sha256" \
            "$RUNNER_TEMP/dist/store-release-${VERSION}-source.tar.gz.sigstore.json" \
            "$RUNNER_TEMP/dist/store-release-${VERSION}-source.tar.gz.intoto.jsonl"
          tagged="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" --jq .object.sha)"
          if [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "error: v$VERSION points at $tagged, not $GITHUB_SHA" >&2
            exit 1
          fi
          echo "v$VERSION is $GITHUB_SHA"
