# Release store-release: dispatch-only, from main. scripts/release_check.py verifies
# everything (version, CHANGELOG section, yanked list, this commit's required CI)
# before the tag exists; the tag and the GitHub Release are created only after it
# passes. Process: docs/release-process.md.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (X.Y.Z). Must equal store_release.__version__ on main.
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # create the tag and the GitHub Release
      checks: read      # read this commit's CI results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Check the release preconditions
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: python3 -I scripts/release_check.py --version "$VERSION" --sha "$GITHUB_SHA" --notes-out "$RUNNER_TEMP/notes.md"
      - name: Create the tag and the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/v$VERSION" -f sha="$GITHUB_SHA" > /dev/null
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md" --latest
