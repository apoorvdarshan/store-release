# iOS release, stage 5 (job "github-release"): creates or updates the tag's GitHub
# Release, titled from ios.github_release.title. Marked Latest only when the tag is
# the highest iOS version. Re-runnable: an existing release is updated.
name: "store-release: iOS GitHub Release"

on:
  workflow_call:
    inputs:
      config:
        description: The app's store-release.toml, relative to its repository root.
        type: string
        default: store/store-release.toml
      gates:
        description: The gate jobs' results, "<job>=<result>" separated by spaces.
        type: string
        required: true
      marketing_version:
        type: string
        required: true
      uploaded_build:
        description: The build number this run uploaded (empty without an upload).
        type: string
        required: true
      tool_sha:
        type: string
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  github-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create or update the GitHub Release
    steps:
      - name: Check out the app's store-release config
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: app
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: /${{ inputs.config }}
      - name: Check out store-release at this workflow's commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .store-release
          persist-credentials: false
      - name: Set up this job
        uses: ./.store-release/.github/actions/job-setup
        with:
          job: ios-github-release
          config: ${{ inputs.config }}
          tool-sha: ${{ job.workflow_sha }}
          expected-tool-sha: ${{ inputs.tool_sha }}
      - name: Check this stage's inputs
        env:
          INPUT_GATES: ${{ inputs.gates }}
          INPUT_VERSION: ${{ inputs.marketing_version }}
          INPUT_UPLOADED_BUILD: ${{ inputs.uploaded_build }}
        run: >-
          python3 -I -u .store-release/run.py --app-root app stage check --stage ios-github-release --gates "$INPUT_GATES"
          --marketing-version "$INPUT_VERSION" --uploaded-build "$INPUT_UPLOADED_BUILD"
      # Empty output (no release notes section): GitHub generates the notes below.
      - name: Prepare reviewed release notes
        run: python3 -I -u .store-release/run.py --app-root app release-notes --if-present "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"
      - name: Print store gates
        env:
          IOS_RELEASE_AUTOMATION: ${{ vars.IOS_RELEASE_AUTOMATION }}
          IOS_CREATE_VERSION: ${{ vars.IOS_CREATE_VERSION }}
          IOS_UPLOAD_BUILD: ${{ vars.IOS_UPLOAD_BUILD }}
          IOS_UPLOAD_LISTING: ${{ vars.IOS_UPLOAD_LISTING }}
          IOS_UPLOAD_WHATS_NEW: ${{ vars.IOS_UPLOAD_WHATS_NEW }}
          IOS_UPLOAD_SCREENSHOTS: ${{ vars.IOS_UPLOAD_SCREENSHOTS }}
          IOS_UPLOAD_CREATIVE_ASSETS: ${{ vars.IOS_UPLOAD_CREATIVE_ASSETS }}
          IOS_SUBMIT_REVIEW: ${{ vars.IOS_SUBMIT_REVIEW }}
          IOS_PUBLIC_RELEASE: ${{ vars.IOS_PUBLIC_RELEASE }}
          STORE_SYNC_REVENUECAT: ${{ vars.STORE_SYNC_REVENUECAT }}
        run: python3 -I -u .store-release/run.py print-switches --platform ios
      # ios.github_release.source_archive: the archive, checksum and Sigstore bundle the
      # source-archive job made (ios-source-archive.yml).
      - name: Get the signed source archive
        if: env.STORE_RELEASE_IOS_SOURCE_ARCHIVE == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ios-source-archive-${{ github.run_id }}
          path: ${{ runner.temp }}/dist
      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.marketing_version }}
          UPLOADED_BUILD: ${{ inputs.uploaded_build }}
        run: >-
          python3 -I -u .store-release/run.py --app-root app github release --platform ios --tag "$GITHUB_REF_NAME" --version "$VERSION"
          --uploaded-build "$UPLOADED_BUILD" --notes-file "$RUNNER_TEMP/release-notes.md" --assets-dir "$RUNNER_TEMP/dist"
