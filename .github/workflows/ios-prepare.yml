# iOS release, stage 1 (job "prepare"): resolves the IOS_* switches, checks everything
# that can fail before anything is built, creates the App Store version when
# IOS_CREATE_VERSION is on, and picks the build number. Apps call it from their
# ios-release.yml, pinned by commit SHA; see docs/workflows.md.
name: "store-release: iOS prepare"

on:
  workflow_call:
    inputs:
      config:
        description: The app's store-release.toml, relative to its repository root.
        type: string
        default: store/store-release.toml
      marketing_version:
        description: Validation runs only; the version to validate as (empty = the project version).
        type: string
        default: ""
    secrets:
      APP_STORE_CONNECT_API_KEY_ID:
        required: false
      APP_STORE_CONNECT_ISSUER_ID:
        required: false
      APP_STORE_CONNECT_API_KEY_P8:
        required: false
    outputs:
      mode:
        description: release (tag push) or validate (manual dispatch).
        value: ${{ jobs.prepare.outputs.mode }}
      create_version:
        value: ${{ jobs.prepare.outputs.create_version }}
      build:
        value: ${{ jobs.prepare.outputs.build }}
      upload_build:
        value: ${{ jobs.prepare.outputs.upload_build }}
      listing:
        value: ${{ jobs.prepare.outputs.listing }}
      whats_new:
        value: ${{ jobs.prepare.outputs.whats_new }}
      screenshots:
        value: ${{ jobs.prepare.outputs.screenshots }}
      creative:
        value: ${{ jobs.prepare.outputs.creative }}
      submit:
        value: ${{ jobs.prepare.outputs.submit }}
      public_release:
        value: ${{ jobs.prepare.outputs.public_release }}
      asc:
        value: ${{ jobs.prepare.outputs.asc }}
      poll_seconds:
        value: ${{ jobs.prepare.outputs.poll_seconds }}
      wait_minutes:
        value: ${{ jobs.prepare.outputs.wait_minutes }}
      marketing_version:
        value: ${{ jobs.prepare.outputs.marketing_version }}
      build_number:
        value: ${{ jobs.prepare.outputs.build_number }}
      tool_sha:
        description: The store-release commit every later job of this run must use.
        value: ${{ jobs.prepare.outputs.tool_sha }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.gates.outputs.mode }}
      create_version: ${{ steps.gates.outputs.create_version }}
      build: ${{ steps.gates.outputs.build }}
      upload_build: ${{ steps.gates.outputs.upload_build }}
      listing: ${{ steps.gates.outputs.listing }}
      whats_new: ${{ steps.gates.outputs.whats_new }}
      screenshots: ${{ steps.gates.outputs.screenshots }}
      creative: ${{ steps.gates.outputs.creative }}
      submit: ${{ steps.gates.outputs.submit }}
      public_release: ${{ steps.gates.outputs.public_release }}
      asc: ${{ steps.gates.outputs.asc }}
      poll_seconds: ${{ steps.gates.outputs.poll_seconds }}
      wait_minutes: ${{ steps.gates.outputs.wait_minutes }}
      marketing_version: ${{ steps.gates.outputs.marketing_version }}
      build_number: ${{ steps.number.outputs.build_number }}
      tool_sha: ${{ steps.tool.outputs.tool_sha }}
    steps:
      - name: Check out the app's store-release config
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: app
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: /${{ inputs.config }}
      - name: Check out store-release at this workflow's commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .store-release
          persist-credentials: false
      - name: Set up this job
        uses: ./.store-release/.github/actions/job-setup
        with:
          job: ios-prepare
          config: ${{ inputs.config }}
          tool-sha: ${{ job.workflow_sha }}
      - name: Record the store-release commit
        id: tool
        env:
          TOOL_SHA: ${{ job.workflow_sha }}
        run: echo "tool_sha=$TOOL_SHA" >> "$GITHUB_OUTPUT"
      # Offline, on validation runs too: switches, build wait and selection, What's
      # New, release notes and log redaction behave as the store steps expect.
      - name: Test the store release tooling (offline)
        run: python3 -I -u .store-release/run.py selftest --platform ios
      # What the config pins about the app's own files, on every run (fud-ai's unit tests
      # checked these in the real files here): ios.export_compliance and ios.creative.sizes.
      - name: Check the app files the config pins
        run: python3 -I -u .store-release/run.py --app-root app config check --pinned
      # A pin the release tag does not point at is only a warning here (Store checks fail on it).
      - name: Check the caller workflow
        env:
          GH_TOKEN: ${{ github.token }}
          TOOL_SHA: ${{ job.workflow_sha }}
          TOOL_REPOSITORY: ${{ job.workflow_repository }}
        run: python3 -I -u .store-release/run.py --app-root app caller check --runtime --platform ios
      - name: Warn when this store-release version is yanked
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TOOL_REPOSITORY: ${{ job.workflow_repository }}
        run: python3 -I -u .store-release/run.py yanked check --warn-only
      # A tag without a release notes section is fine (GitHub generates the notes);
      # an empty or duplicated section is not.
      - name: Check release notes, IAP catalog and RevenueCat gate
        if: github.event_name == 'push'
        env:
          STORE_SYNC_REVENUECAT: ${{ vars.STORE_SYNC_REVENUECAT }}
        run: |
          set -euo pipefail
          python3 -I -u .store-release/run.py --app-root app release-notes --if-present "$GITHUB_REF_NAME" > /dev/null
          python3 -I -u .store-release/run.py --app-root app catalog check
          python3 -I -u .store-release/run.py --app-root app revenuecat-gate
      - name: Resolve iOS release switches
        id: gates
        env:
          IOS_RELEASE_AUTOMATION: ${{ vars.IOS_RELEASE_AUTOMATION }}
          IOS_CREATE_VERSION: ${{ vars.IOS_CREATE_VERSION }}
          IOS_UPLOAD_BUILD: ${{ vars.IOS_UPLOAD_BUILD }}
          IOS_UPLOAD_LISTING: ${{ vars.IOS_UPLOAD_LISTING }}
          IOS_UPLOAD_WHATS_NEW: ${{ vars.IOS_UPLOAD_WHATS_NEW }}
          IOS_UPLOAD_SCREENSHOTS: ${{ vars.IOS_UPLOAD_SCREENSHOTS }}
          IOS_UPLOAD_CREATIVE_ASSETS: ${{ vars.IOS_UPLOAD_CREATIVE_ASSETS }}
          IOS_SUBMIT_REVIEW: ${{ vars.IOS_SUBMIT_REVIEW }}
          IOS_PUBLIC_RELEASE: ${{ vars.IOS_PUBLIC_RELEASE }}
          IOS_BUILD_POLL_SECONDS: ${{ vars.IOS_BUILD_POLL_SECONDS }}
          IOS_BUILD_WAIT_MINUTES: ${{ vars.IOS_BUILD_WAIT_MINUTES }}
          VALIDATION_MARKETING_VERSION: ${{ inputs.marketing_version }}
        run: python3 -I -u .store-release/run.py --app-root app ios gates
      - name: Check App Store Connect secrets are set
        if: >-
          steps.gates.outputs.build == 'true' || steps.gates.outputs.asc == 'true' ||
          steps.gates.outputs.create_version == 'true'
        env:
          HAS_APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID != '' }}
          HAS_APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID != '' }}
          HAS_APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 != '' }}
        run: python3 -I -u .store-release/run.py --app-root app secrets check APP_STORE_CONNECT_API_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_API_KEY_P8
      # Fail before building when switched-on text would not fit the store.
      - name: Check listing text
        if: steps.gates.outputs.listing == 'true'
        run: python3 -I -u .store-release/run.py --app-root app listing prepare --platform ios --out "$RUNNER_TEMP/listing-check"
      - name: Check What's New
        if: steps.gates.outputs.whats_new == 'true'
        run: python3 -I -u .store-release/run.py --app-root app whats-new prepare --platform ios --tag "$GITHUB_REF_NAME" --out "$RUNNER_TEMP/whats-new-check"
      # Local files only: sizes, formats, alpha and well-formed files. Their Asset
      # Library state is checked by the version check below.
      - name: Check header and search results images
        if: steps.gates.outputs.creative == 'true'
        env:
          UPLOAD_CREATIVE_ASSETS: "true"
        run: python3 -I -u .store-release/run.py --app-root app ios store-step --dry-run
      - name: Install store tooling
        if: >-
          steps.gates.outputs.build == 'true' || steps.gates.outputs.asc == 'true' ||
          steps.gates.outputs.create_version == 'true'
        run: python3 -m pip install --disable-pip-version-check --require-hashes -r .store-release/requirements.txt
      # Tag runs only. Adds the App Store version for this tag when App Store Connect
      # does not have it yet; refuses, before anything is built, when another version
      # is still on its way to the store or this version is not the newest.
      - name: Create the App Store version if it is missing (IOS_CREATE_VERSION)
        if: steps.gates.outputs.mode == 'release' && steps.gates.outputs.create_version == 'true'
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          CREATE_IOS_VERSION: ${{ steps.gates.outputs.create_version }}
          MARKETING_VERSION: ${{ steps.gates.outputs.marketing_version }}
        run: python3 -I -u .store-release/run.py --app-root app ios store-step --create-version --version "$MARKETING_VERSION"
      # Read-only. Fails now, before the archive and upload, when the version is
      # missing or already in review, when a READY_FOR_REVIEW version has no usable
      # draft, or when the header / search results images cannot go on it now.
      - name: Check the App Store version (read-only)
        if: steps.gates.outputs.asc == 'true'
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          MARKETING_VERSION: ${{ steps.gates.outputs.marketing_version }}
          UPLOAD_LISTING: ${{ steps.gates.outputs.listing }}
          UPLOAD_WHATS_NEW: ${{ steps.gates.outputs.whats_new }}
          UPLOAD_SCREENSHOTS: ${{ steps.gates.outputs.screenshots }}
          UPLOAD_CREATIVE_ASSETS: ${{ steps.gates.outputs.creative }}
          SUBMIT_IOS_REVIEW: ${{ steps.gates.outputs.submit }}
        run: python3 -I -u .store-release/run.py --app-root app ios version-preflight --version "$MARKETING_VERSION"
      - name: Choose the build number
        id: number
        if: steps.gates.outputs.build == 'true'
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: python3 -I -u .store-release/run.py --app-root app ios build-number
