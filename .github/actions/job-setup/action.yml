name: store-release job setup
description: >-
  Internal to store-release. Python 3.13, the tooling identity check, the app's
  store-release.toml and this job's sparse checkout of the app.
inputs:
  job:
    description: The paths job id (ios-prepare, ios-build, ...).
    required: true
  config:
    description: The app's config path, relative to its repository root.
    required: true
  tool-sha:
    description: The calling job's job.workflow_sha.
    required: true
  expected-tool-sha:
    description: The tool_sha output of this run's prepare or gates job (empty in that job).
    required: false
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.13"
    - name: Check the tooling and the config
      shell: bash
      env:
        TOOL_SHA: ${{ inputs.tool-sha }}
        EXPECTED_TOOL_SHA: ${{ inputs.expected-tool-sha }}
        SETUP_JOB: ${{ inputs.job }}
        SETUP_CONFIG: ${{ inputs.config }}
      run: |
        set -euo pipefail
        tool=(python3 -I -u .store-release/run.py --app-root app --config "$SETUP_CONFIG")
        "${tool[@]}" tool check --tool-sha "$TOOL_SHA" --expected "$EXPECTED_TOOL_SHA"
        "${tool[@]}" config check
        "${tool[@]}" paths --job "$SETUP_JOB" > "$RUNNER_TEMP/store-release-paths.txt"
    # Blobless and credential-free: the job's read-only token reaches only the lazy blob fetch
    # (private app repositories), as environment config (fetch-app-files.sh).
    - name: Check out this job's files of the app
      shell: bash
      env:
        FETCH_TOKEN: ${{ github.token }}
      run: bash "$GITHUB_ACTION_PATH/fetch-app-files.sh" app "$RUNNER_TEMP/store-release-paths.txt"
    - name: Export this job's config
      shell: bash
      env:
        SETUP_JOB: ${{ inputs.job }}
        SETUP_CONFIG: ${{ inputs.config }}
      run: python3 -I -u .store-release/run.py --app-root app --config "$SETUP_CONFIG" config export --job "$SETUP_JOB"
