version: 2
updates:
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/job-setup"]
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    ignore:
      # The re-run probe pins this repository's own commit; never bump it.
      - dependency-name: "apoorvdarshan/store-release*"
    groups:
      github-actions:
        patterns: ["*"]
    # These pins run with every app's signing credentials: let a new release age a week
    # first. Security updates are never delayed by a cooldown.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "CI"
  - package-ecosystem: pip
    # / holds the store, checks and lint locks; /fuzz the Atheris lock.
    directories: ["/", "/fuzz"]
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    groups:
      python:
        patterns: ["*"]
    cooldown:
      default-days: 7
    commit-message:
      prefix: "Deps"
