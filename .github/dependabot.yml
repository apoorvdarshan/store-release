version: 2
updates:
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/job-setup"]
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    ignore:
      # The re-run probe pins this repository's own commit; never bump it.
      - dependency-name: "apoorvdarshan/store-release*"
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "CI"
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    groups:
      python:
        patterns: ["*"]
    commit-message:
      prefix: "Deps"
